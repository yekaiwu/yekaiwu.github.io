name: Build portfolio

on:
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      artifact-id:
        description: GitHub Pages artifact ID
        value: ${{ jobs.build.outputs.artifact-id }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.164.0
          extended: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portfolio and search index
        run: pnpm build

      - id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
